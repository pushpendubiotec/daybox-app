name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake gettext libreadline-dev libgdbm-dev \
            libsqlite3-dev libbz2-dev

      - name: Cache Android NDK r25c
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/ndk-cache
          key: android-ndk-r25c-linux

      - name: Download Android NDK r25c
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/ndk-cache
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /home/runner/ndk-cache
          rm /tmp/ndk.zip
          ls /home/runner/ndk-cache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.33
          pip install buildozer==1.5.0

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plendar-apk
          path: bin/*.apk
